# ==============================================================================
# Nginx Reverse Proxy Configuration for Parts-Database on Node 02 (tasker-pi)
# Place in /etc/nginx/sites-available/parts-database and symlink to sites-enabled
# ==============================================================================

server {
    listen 80;
    server_name parts.local tasker-pi.local;

    # Dedicated Parts Database Root (or proxy via :8090)
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for live camera scanner & fast updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Static Assets Caching
    location /static/ {
        alias /opt/parts-database/server/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
